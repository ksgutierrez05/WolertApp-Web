<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WolertApp — Policías</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/policias.css">
</head>
<body class="rol-policia">

  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <div id="wrapperDash">
    <main class="main-dash">
      <div class="container-fluid">

        <!-- Topbar -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-0 bg-transparent" placeholder="Buscar por alerta, barrio, unidad, policía…">
          </div>
          <button class="icon-btn-dash btn btn-light rounded-circle position-relative">
            <i class="bi bi-bell"></i>
            <span class="dot-danger-dash position-absolute top-0 end-0"></span>
          </button>
          <span class="avatar-dash">SG</span>
        </div>

        <!-- Encabezado -->
        <div class="header-vista-dash mb-4">
          <div>
            <h1>Policías</h1>
            <p>Administra el personal policial y su asignación a unidades.</p>
          </div>
          <button class="btn-cv-verde" id="btnNuevoPolicia">
            <i class="bi bi-plus-lg"></i> Nuevo policía
          </button>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4" id="kpisPolicias"></div>

        <!-- Filtros -->
        <div class="filtros-toolbar-dash mb-3">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" id="buscarPolicia" class="form-control border-0 bg-transparent" placeholder="Buscar por nombre, placa o rango…">
          </div>
          <select id="filtroEstadoPolicia" class="form-select">
            <option value="">Todos los estados</option>
            <option value="DISPONIBLE">Disponible</option>
            <option value="EN_SERVICIO">En servicio</option>
            <option value="OCUPADO">Ocupado</option>
            <option value="FUERA_DE_SERVICIO">Fuera de servicio</option>
          </select>
          <select id="filtroUnidadPolicia" class="form-select">
            <option value="">Todas las unidades</option>
          </select>
        </div>

        <!-- Tabla -->
        <div class="card-panel-dash mb-4">
          <div class="tabla-header-dash">
            <span class="flex-grow-1">Policía</span>
            <span style="width:110px;">Placa</span>
            <span style="width:130px;">Rango</span>
            <span style="width:150px;">Unidad</span>
            <span style="width:150px;">Estado</span>
            <span style="width:110px;">Acciones</span>
          </div>
          <table class="tabla-dash">
            <tbody id="tablaPolicias"></tbody>
          </table>
          <div class="tabla-vacio-dash d-none" id="policiasVacio">No se encontraron policías con esos filtros.</div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal crear/editar policía -->
  <div class="modal fade" id="modalPolicia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header modal-header-dash">
          <div>
            <div class="modal-title" id="modalPoliciaTitulo">Nuevo policía</div>
            <div class="modal-subtitle">Registra un agente y asígnalo a una unidad</div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="formPolicia">
          <div class="modal-body modal-body-dash">
            <input type="hidden" id="policiaId">
            <div class="row g-3">
              <div class="col-md-6 form-field-dash">
                <label for="policiaCedula">Cédula *</label>
                <input type="text" class="form-control" id="policiaCedula" required>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaPlaca">Placa *</label>
                <input type="text" class="form-control" id="policiaPlaca" placeholder="Ej: P-1042" required>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaNombre1">Primer nombre *</label>
                <input type="text" class="form-control" id="policiaNombre1" required>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaNombre2">Segundo nombre</label>
                <input type="text" class="form-control" id="policiaNombre2">
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaApellido1">Primer apellido *</label>
                <input type="text" class="form-control" id="policiaApellido1" required>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaApellido2">Segundo apellido</label>
                <input type="text" class="form-control" id="policiaApellido2">
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaRango">Rango *</label>
                <select class="form-select" id="policiaRango" required>
                  <option value="Patrullero">Patrullero</option>
                  <option value="Subintendente">Subintendente</option>
                  <option value="Intendente">Intendente</option>
                  <option value="Comandante">Comandante</option>
                </select>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaUnidad">Unidad asignada *</label>
                <select class="form-select" id="policiaUnidad" required></select>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaEstado">Estado *</label>
                <select class="form-select" id="policiaEstado" required>
                  <option value="DISPONIBLE">Disponible</option>
                  <option value="EN_SERVICIO">En servicio</option>
                  <option value="OCUPADO">Ocupado</option>
                  <option value="FUERA_DE_SERVICIO">Fuera de servicio</option>
                </select>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaTelefono">Teléfono</label>
                <input type="text" class="form-control" id="policiaTelefono">
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaCorreo">Correo</label>
                <input type="email" class="form-control" id="policiaCorreo">
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaUsername">Username *</label>
                <input type="text" class="form-control" id="policiaUsername" required>
              </div>
              <div class="col-md-6 form-field-dash">
                <label for="policiaPassword">Contraseña <span id="passwordHint">*</span></label>
                <input type="password" class="form-control" id="policiaPassword" placeholder="••••••••">
              </div>
            </div>
          </div>
          <div class="modal-footer modal-footer-dash">
            <button type="button" class="btn-secundario-dash" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn-cv-verde"><i class="bi bi-check-lg"></i> Guardar policía</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal ver policía -->
  <div class="modal fade" id="modalVerPolicia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header modal-header-dash">
          <div class="detalle-header-dash w-100">
            <div class="avatar-lg-dash" id="verPoliciaAvatar">—</div>
            <div class="modal-title" id="verPoliciaNombre">—</div>
            <span class="badge-dash" id="verPoliciaEstado">—</span>
          </div>
          <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body modal-body-dash">
          <div class="detalle-fila-dash"><span class="k">Cédula</span><span class="v" id="verPoliciaCedula">—</span></div>
          <div class="detalle-fila-dash"><span class="k">Placa</span><span class="v" id="verPoliciaPlaca">—</span></div>
          <div class="detalle-fila-dash"><span class="k">Rango</span><span class="v" id="verPoliciaRango">—</span></div>
          <div class="detalle-fila-dash"><span class="k">Unidad</span><span class="v" id="verPoliciaUnidad">—</span></div>
          <div class="detalle-fila-dash"><span class="k">Teléfono</span><span class="v" id="verPoliciaTelefono">—</span></div>
          <div class="detalle-fila-dash"><span class="k">Correo</span><span class="v" id="verPoliciaCorreo">—</span></div>
        </div>
        <div class="modal-footer modal-footer-dash">
          <button type="button" class="btn-secundario-dash" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sidebar-policia.js"></script>
  <script src="../js/policias.js"></script>
</body>
</html>
