<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WolertApp — Estadísticas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/estadisticas.css">
</head>
<body class="rol-policia">

  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <div id="wrapperDash">
    <main class="main-dash">
      <div class="container-fluid">

        <!-- Topbar -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-0 bg-transparent" placeholder="Buscar por alerta, barrio, unidad, policía…">
          </div>
          <button class="icon-btn-dash btn btn-light rounded-circle position-relative">
            <i class="bi bi-bell"></i>
            <span class="dot-danger-dash position-absolute top-0 end-0"></span>
          </button>
          <span class="avatar-dash">SG</span>
        </div>

        <!-- Encabezado -->
        <div class="header-vista-dash mb-4">
          <div>
            <h1>Estadísticas</h1>
            <p>Métricas operacionales del sistema policial.</p>
          </div>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4" id="kpisEstadisticas"></div>

        <!-- Barras: alertas por estado / policías por estado -->
        <div class="row g-3 mb-4">
          <div class="col-lg-6">
            <div class="card-panel-dash p-3 h-100">
              <p class="section-title-dash fw-bold mb-3"><i class="bi bi-bell me-2"></i>Alertas por estado</p>
              <div id="barrasAlertas"></div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card-panel-dash p-3 h-100">
              <p class="section-title-dash fw-bold mb-3"><i class="bi bi-people me-2"></i>Policías por estado</p>
              <div id="barrasPolicias"></div>
            </div>
          </div>
        </div>

        <!-- Estado de alarmas y unidades -->
        <div class="card-panel-dash p-3 mb-4">
          <p class="section-title-dash fw-bold mb-2"><i class="bi bi-activity me-2"></i>Estado de alarmas y unidades</p>
          <div id="filasEstado"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/sidebar-policia.js"></script>
  <script src="../js/estadisticas.js"></script>
</body>
</html>
