<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WolertApp — Historial</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/historial.css">
</head>
<body class="rol-policia">

  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <div id="wrapperDash">
    <main class="main-dash">
      <div class="container-fluid">

        <!-- Topbar -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-0 bg-transparent" placeholder="Buscar por alerta, barrio, unidad, policía…">
          </div>
          <button class="icon-btn-dash btn btn-light rounded-circle position-relative">
            <i class="bi bi-bell"></i>
            <span class="dot-danger-dash position-absolute top-0 end-0"></span>
          </button>
          <span class="avatar-dash">SG</span>
        </div>

        <!-- Encabezado -->
        <div class="header-vista-dash mb-4">
          <div>
            <h1>Historial de Atenciones</h1>
            <p>Registro completo de alertas atendidas por las unidades policiales.</p>
          </div>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4" id="kpisHistorial"></div>

        <!-- Card con filtros + timeline -->
        <div class="card-panel-dash mb-4">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 p-3" style="border-bottom:1px solid var(--line);">
            <p class="section-title-dash fw-bold m-0"><i class="bi bi-clock-history me-2"></i>Línea de tiempo <span class="celda-sub-dash" style="font-weight:400;">— más recientes primero</span></p>
            <div class="chips-filtro-dash" id="chipsEstado">
              <button class="chip-filtro-dash activo" data-estado="">Todas</button>
              <button class="chip-filtro-dash" data-estado="FINALIZADA">Finalizadas</button>
              <button class="chip-filtro-dash" data-estado="EN_PROCESO">En proceso</button>
              <button class="chip-filtro-dash" data-estado="PENDIENTE">Pendientes</button>
              <button class="chip-filtro-dash" data-estado="CANCELADA">Canceladas</button>
            </div>
          </div>
          <div class="timeline-dash" id="timelineHistorial"></div>
          <div class="tabla-vacio-dash d-none" id="historialVacio" style="text-align:center;padding:48px 20px;color:var(--muted);font-size:13.5px;">
            Sin atenciones registradas con ese filtro.
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/sidebar-policia.js"></script>
  <script src="../js/historial.js"></script>
</body>
</html>
