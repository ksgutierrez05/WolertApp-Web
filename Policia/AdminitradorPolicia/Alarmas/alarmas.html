<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WolertApp — Alarmas</title>

<!-- Bootstrap (layout + iconos, igual que el resto del proyecto) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Sistema compartido de estilos (rutas desde Policia/AdminitradorPolicia/Alarmas/) -->
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/alarmas.css">
</head>
<body class="rol-policia">

  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <div id="wrapperDash">
    <main class="main-dash">
      <div class="container-fluid">

        <!-- Topbar (igual en todos los roles) -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" id="buscarAlarma" class="form-control border-0 bg-transparent" placeholder="Buscar alarma por nombre o barrio…">
          </div>
          <button class="icon-btn-dash btn btn-light rounded-circle position-relative">
            <i class="bi bi-bell"></i>
            <span class="dot-danger-dash position-absolute top-0 end-0"></span>
          </button>
          <span class="avatar-dash">SG</span>
        </div>

        <!-- Encabezado de la vista -->
        <div class="d-flex align-items-end justify-content-between flex-wrap gap-2 mb-4">
          <div>
            <p class="page-title-dash fw-bold m-0">Alarmas</p>
            <p class="info-sub-dash m-0">Gestión y monitoreo de las alarmas comunitarias registradas por barrio.</p>
          </div>
          <button class="btn btn-cv-azul rounded-pill d-inline-flex align-items-center gap-2">
            <i class="bi bi-plus-lg"></i> Nueva alarma
          </button>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiTotal">0</p>
                <p class="kpi-solid-label-dash">Total de alarmas</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-megaphone"></i></span>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiActivas">0</p>
                <p class="kpi-solid-label-dash">Activas</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-broadcast"></i></span>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiInactivas">0</p>
                <p class="kpi-solid-label-dash">Inactivas</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-check-circle"></i></span>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiMantenimiento">0</p>
                <p class="kpi-solid-label-dash">En mantenimiento</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-tools"></i></span>
            </div>
          </div>
        </div>

        <!-- Filtros por estado -->
        <div class="d-flex gap-2 flex-wrap mb-3" id="filtrosAlarmas">
          <button class="chip-filtro-dash active" data-filtro="todas">Todas</button>
          <button class="chip-filtro-dash" data-filtro="ACTIVA">Activas</button>
          <button class="chip-filtro-dash" data-filtro="INACTIVA">Inactivas</button>
          <button class="chip-filtro-dash" data-filtro="EN_MANTENIMIENTO">En mantenimiento</button>
        </div>

        <!-- Tabla de alarmas -->
        <div class="card-panel-dash p-3">
          <div class="table-responsive">
            <table class="table table-borderless align-middle tabla-alarmas-dash mb-0">
              <thead>
                <tr>
                  <th>Alarma</th>
                  <th>Barrio</th>
                  <th>Coordenadas</th>
                  <th>Radio cobertura</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="filaAlarmas"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts al final: primero la librería del sidebar, luego la lógica propia de esta página -->
  <script src="../js/sidebar-policia.js"></script>
  <script src="../js/alarmas.js"></script>
</body>
</html>
