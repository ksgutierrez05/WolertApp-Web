<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WolertApp — Mapas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/mapa.css">
</head>
<body class="rol-policia">

  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <div id="wrapperDash">
    <main class="main-dash">
      <div class="container-fluid">

        <!-- Topbar -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-0 bg-transparent" placeholder="Buscar alerta, dirección o caso…" disabled>
          </div>
          <button class="btn icon-btn-dash rounded-circle bg-white border-0">
            <i class="bi bi-bell"></i>
            <span class="icon-dot-dash"></span>
          </button>
          <span class="avatar-dash">JR</span>
        </div>

        <!-- Estado vacío: Mapas próximamente -->
        <div class="card-panel-dash mp-wrap">

          <div class="mp-radar" aria-hidden="true">
            <span class="mp-ring mp-ring-1"></span>
            <span class="mp-ring mp-ring-2"></span>
            <span class="mp-ring mp-ring-3"></span>
            <span class="mp-grid mp-grid-h"></span>
            <span class="mp-grid mp-grid-v"></span>
            <span class="mp-sweep"></span>
            <span class="mp-blip mp-blip-1"></span>
            <span class="mp-blip mp-blip-2"></span>
            <span class="mp-blip mp-blip-3"></span>
            <span class="mp-core"></span>
          </div>

          <p class="mp-tag">Mapas</p>
          <h1 class="mp-title">Próximamente</h1>
          <p class="mp-desc">
            Vas a poder ver tus casos, tu unidad y la ruta más rápida en un mapa en
            tiempo real. Todavía lo estamos afinando.
          </p>

        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/mapas.js"></script>
</body>
</html>
