<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Unidad — WolertApp</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<!-- Estilos globales del panel (NO se tocan) -->
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/unidad.css">

</head>

<body class="rol-policia">

<div id="wrapperDash">
  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <main class="main-dash">
    <div class="container-fluid">

      <!-- Topbar -->
      <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h1 class="page-title-dash"><i class="bi bi-people me-2"></i>Mi Unidad</h1>
          <p class="mb-0" style="font-size:13px;color:var(--muted);">Consulta quiénes conforman tu unidad y su estado operativo</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="icon-btn-dash btn btn-light rounded-circle border">
            <i class="bi bi-bell"></i>
            <span class="icon-dot-dash"></span>
          </button>
          <div class="avatar-dash">JP</div>
        </div>
      </div>

      <!-- Ficha de la unidad -->
      <div class="ficha-uni mb-4">
        <div class="ficha-uni-izq">
          <div class="ficha-uni-icono"><i class="bi bi-shield-shaded"></i></div>
          <div>
            <p class="ficha-uni-nombre">Unidad Alpha 03</p>
            <p class="ficha-uni-sub"><i class="bi bi-geo-alt me-1"></i>CAI Centro</p>
          </div>
        </div>
        <div class="ficha-uni-der">
          <div class="ficha-uni-dato">
            <span class="num">2</span>
            <span class="lbl">Alertas asignadas a la unidad</span>
          </div>
          <div class="ficha-uni-dato">
            <span class="num">1</span>
            <span class="lbl">Atenciones activas</span>
          </div>
        </div>
      </div>

      <!-- KPIs de estado operativo -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-blue-dash">
            <i class="bi bi-people-fill kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiTotalUni">0</div>
            <div class="kpi-label-dash">Integrantes</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-green-dash">
            <i class="bi bi-check-circle kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiDisponiblesUni">0</div>
            <div class="kpi-label-dash">Disponibles</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-amber-dash">
            <i class="bi bi-hourglass-split kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiAtencionUni">0</div>
            <div class="kpi-label-dash">En atención</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-red-dash">
            <i class="bi bi-signpost-split kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiCaminoUni">0</div>
            <div class="kpi-label-dash">En camino</div>
          </div>
        </div>
      </div>

      <!-- Integrantes -->
      <div class="card-panel-dash p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <p class="section-title-dash mb-0">Integrantes de la unidad</p>
          <span style="font-size:11.5px;color:var(--subtle);">Solo lectura</span>
        </div>
        <div id="listaIntegrantesUni"></div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/unidad.js"></script>
</body>
</html>
