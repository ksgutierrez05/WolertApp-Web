<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Asignación — Central de Radio | WolertApp</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tipografías del sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Estilos generales -->
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/temas.css">

    <!-- Estilos propios de esta pantalla -->
    <link rel="stylesheet" href="../css/asignaciones.css">
</head>

<!-- Central de Radio utiliza la paleta de Policía -->

<body class="rol-policia">

    <div id="wrapperDash">

        <!-- ===================== SIDEBAR ===================== -->
        <aside class="sidebar-dash" id="sidebarDash"></aside>


        <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
        <main class="main-dash">

            <div class="container-fluid">

                <!-- ===================== TOPBAR ===================== -->

                <div class="d-flex align-items-center justify-content-between gap-3 mb-4 flex-wrap">

                    <!-- Buscador -->
                    <div class="search-dash flex-grow-1" style="max-width: 420px;">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input type="text" class="form-control" placeholder="Buscar caso, patrullero o zona...">

                        </div>

                    </div>


                    <!-- Acciones -->
                    <div class="d-flex align-items-center gap-2">

                        <button class="btn icon-btn-dash rounded-circle bg-white border" type="button"
                            aria-label="Notificaciones">
                            <i class="bi bi-bell"></i>
                            <span class="icon-dot-dash"></span>
                        </button>


                        <div class="avatar-dash" title="Operador de Central">
                            OC
                        </div>

                    </div>

                </div>


                <!-- ===================== ENCABEZADO ===================== -->

                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">

                    <div>

                        <h1 class="page-title-dash">
                            <i class="bi bi-broadcast-pin me-2"></i>
                            Asignación
                        </h1>

                        <p class="text-muted mb-0" style="font-size: 13.5px;">
                            Selecciona una alerta clasificada y asigna el patrullero más adecuado.
                            Las reasignaciones requieren confirmación.
                        </p>

                    </div>

                </div>


                <!-- ===================== KPIs ===================== -->

                <div class="row g-3 mb-4" id="kpisDespacho">
                    <!-- Las tarjetas se generan mediante asignaciones.js -->
                </div>


                <!-- ===================== CUERPO ===================== -->

                <div class="asig-layout">

                    <!-- ===================== LISTA ===================== -->

                    <section class="asig-col-list card-panel-dash">

                        <!-- Pestañas -->
                        <div class="asig-tabs" role="tablist">

                            <button type="button" class="asig-tab active" data-tab="pendientes" role="tab"
                                aria-selected="true">
                                Por asignar

                                <span class="asig-tab-count" id="countPendientes">
                                    0
                                </span>
                            </button>


                            <button type="button" class="asig-tab" data-tab="seguimiento" role="tab"
                                aria-selected="false">
                                En seguimiento

                                <span class="asig-tab-count" id="countSeguimiento">
                                    0
                                </span>
                            </button>

                        </div>


                        <!-- Filtro -->
                        <div class="asig-search">

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-funnel"></i>
                                </span>

                                <input type="text" class="form-control" id="buscarAlerta"
                                    placeholder="Filtrar por número de caso, tipo o zona...">

                            </div>

                        </div>


                        <!-- Lista de pendientes -->
                        <div class="asig-lista" id="listaPendientes" aria-live="polite"></div>


                        <!-- Lista de seguimiento -->
                        <div class="asig-lista d-none" id="listaSeguimiento" aria-live="polite"></div>

                    </section>


                    <!-- ===================== DETALLE ===================== -->

                    <section class="asig-col-detalle card-panel-dash" id="panelDetalle" aria-live="polite">
                        <!-- Contenido generado dinámicamente por asignaciones.js -->
                    </section>

                </div>

            </div>

        </main>

    </div>


    <!-- ===================== MODAL ===================== -->

    <div class="modal fade" id="modalConfirmarAsignacion" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="modalConfirmarTitulo">
                        Confirmar asignación
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>

                </div>


                <div class="modal-body" id="modalConfirmarBody">
                    <!-- Texto generado por JS -->
                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-cv-azul" id="btnConfirmarAsignacion">
                        Confirmar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================== TOAST ===================== -->

    <div class="toast-container position-fixed bottom-0 end-0 p-3">

        <div id="toastContacto" class="toast asig-toast" role="status" aria-live="polite" aria-atomic="true">

            <div class="toast-body d-flex align-items-center gap-2">

                <i class="bi bi-broadcast"></i>

                <span id="toastContactoBody"></span>

            </div>

        </div>

    </div>


    <!-- ===================== BOOTSTRAP JS ===================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- ===================== SIDEBAR ===================== -->

    <script src="../js/sidebar-central.js"></script>

    <script>
        renderSidebarCentral('asignacion');
    </script>


    <!-- ===================== LÓGICA DE ASIGNACIÓN ===================== -->

    <script src="../js/asignaciones.js"></script>

</body>

</html>
