<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notificaciones — WolertApp</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<!-- Estilos globales del panel (NO se tocan) -->
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/notificaciones.css">

</head>

<body class="rol-policia">

<div id="wrapperDash">
  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <main class="main-dash">
    <div class="container-fluid">

      <!-- Topbar -->
      <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h1 class="page-title-dash"></i>Notificaciones</h1>
          <p class="mb-0" style="font-size:13px;color:var(--muted);">Comunicaciones recibidas de la Central de Radio y del sistema</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="icon-btn-dash btn btn-light rounded-circle border">
            <i class="bi bi-bell"></i>
            <span class="icon-dot-dash"></span>
          </button>
          <div class="avatar-dash">JP</div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="filtros-not" id="filtrosNot">
          <button class="chip-filtro-not active" data-filtro="TODAS">Todas</button>
          <button class="chip-filtro-not" data-filtro="NO_LEIDAS">No leídas</button>
        </div>
        <button class="btn-marcar-todas-not" id="btnMarcarTodasNot">
          <i class="bi bi-check2-all"></i>
          Marcar todas como leídas
        </button>
      </div>

      <div class="card-panel-dash p-1 p-md-2">
        <div id="listaNotificaciones"></div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/notificaciones.js"></script>
</body>
</html>
