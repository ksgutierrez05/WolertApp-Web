<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Atenciones — WolertApp</title>

<!-- Bootstrap + Bootstrap Icons (mismo CDN que el resto del panel) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<!-- Estilos globales del panel (NO se tocan) -->
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/atenciones.css">

</head>

<body class="rol-policia">

<div id="wrapperDash">
  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <main class="main-dash">
    <div class="container-fluid">

      <!-- Topbar -->
      <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h1 class="page-title-dash"><i class="bi bi-check2-circle me-2"></i>Mis Atenciones</h1>
          <p class="mb-0" style="font-size:13px;color:var(--muted);">Alertas que aceptaste y estás atendiendo en campo</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="icon-btn-dash btn btn-light rounded-circle border">
            <i class="bi bi-bell"></i>
            <span class="icon-dot-dash"></span>
          </button>
          <div class="avatar-dash">JP</div>
        </div>
      </div>

      <!-- KPIs -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-blue-dash">
            <i class="bi bi-list-check kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiTotal">0</div>
            <div class="kpi-label-dash">Atenciones activas</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-amber-dash">
            <i class="bi bi-signpost-split kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiCamino">0</div>
            <div class="kpi-label-dash">En camino</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-red-dash">
            <i class="bi bi-geo-alt kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiSitio">0</div>
            <div class="kpi-label-dash">En el sitio</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="kpi-dash kpi-green-dash">
            <i class="bi bi-clipboard-check kpi-icon-dash"></i>
            <div class="kpi-num-dash" id="kpiPorCerrar">0</div>
            <div class="kpi-label-dash">Por cerrar</div>
          </div>
        </div>
      </div>

      <!-- Layout principal -->
      <div class="layout-at">

        <!-- Columna izquierda: lista -->
        <div>
          <div class="filtros-at" id="filtrosAt">
            <button class="chip-filtro-at active" data-filtro="TODAS">Todas</button>
            <button class="chip-filtro-at" data-filtro="ACEPTADA">Aceptadas</button>
            <button class="chip-filtro-at" data-filtro="EN_CAMINO">En camino</button>
            <button class="chip-filtro-at" data-filtro="EN_SITIO">En el sitio</button>
            <button class="chip-filtro-at" data-filtro="ATENDIDA">Atendidas</button>
          </div>

          <div class="lista-at" id="listaAt"></div>
        </div>

        <!-- Columna derecha: detalle -->
        <div class="panel-detalle-at" id="panelDetalleAt">
          <div class="vacio-at">
            <i class="bi bi-clipboard2-check"></i>
            <p class="mb-0">Selecciona una atención de la lista<br>para ver su detalle y actualizar su estado.</p>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/atenciones.js"></script>
</body>
</html>
