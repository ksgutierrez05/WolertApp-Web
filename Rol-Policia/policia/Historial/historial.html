<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Historial — WolertApp</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<!-- Estilos globales del panel (NO se tocan) -->
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/historial.css">

</head>

<body class="rol-policia">

<div id="wrapperDash">
  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <main class="main-dash">
    <div class="container-fluid">

      <!-- Topbar -->
      <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h1 class="page-title-dash"></i>Historial</h1>
          <p class="mb-0" style="font-size:13px;color:var(--muted);">Consulta tus atenciones anteriores</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="icon-btn-dash btn btn-light rounded-circle border">
            <i class="bi bi-bell"></i>
            <span class="icon-dot-dash"></span>
          </button>
          <div class="avatar-dash">JP</div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="card-panel-dash p-3 mb-4">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-2">
            <label class="label-filtro-his">Fecha</label>
            <input type="date" class="form-control form-control-sm" id="filtroFechaHis">
          </div>
          <div class="col-6 col-md-2">
            <label class="label-filtro-his">Tipo de alerta</label>
            <select class="form-select form-select-sm" id="filtroTipoHis">
              <option value="">Todos</option>
              <option>Robo</option>
              <option>Riña</option>
              <option>Accidente</option>
              <option>Persona sospechosa</option>
              <option>Vandalismo</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="label-filtro-his">Estado</label>
            <select class="form-select form-select-sm" id="filtroEstadoHis">
              <option value="">Todos</option>
              <option value="ATENDIDA">Atendida</option>
              <option value="CERRADA">Cerrada</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="label-filtro-his">Zona</label>
            <input type="text" class="form-control form-control-sm" id="filtroZonaHis" placeholder="Ej: Centro">
          </div>
          <div class="col-6 col-md-2">
            <label class="label-filtro-his">N.° de caso</label>
            <input type="text" class="form-control form-control-sm" id="filtroCasoHis" placeholder="Ej: AT-1042">
          </div>
          <div class="col-6 col-md-2">
            <button class="btn btn-cv-azul btn-sm w-100" id="btnFiltrarHis">Filtrar</button>
          </div>
        </div>
      </div>

      <!-- Layout: lista + detalle -->
      <div class="layout-his">
        <div class="lista-his" id="listaHis"></div>

        <div class="panel-detalle-his" id="panelDetalleHis">
          <div class="vacio-his">
            <i class="bi bi-file-earmark-text"></i>
            <p class="mb-0">Selecciona una atención del historial<br>para ver el detalle completo.</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/historial.js"></script>
</body>
</html>
