<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WolertApp — Alarmas</title>

<!-- Bootstrap (layout + iconos, igual que el resto del proyecto) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Sistema compartido de estilos (rutas desde Policia/AdminitradorPolicia/Alarmas/) -->
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/temas.css">
<link rel="stylesheet" href="../css/alarmas.css">
</head>
<body class="rol-policia">

  <aside class="sidebar-dash" id="sidebarDash"></aside>

  <div id="wrapperDash">
    <main class="main-dash">
      <div class="container-fluid">

        <!-- Topbar -->
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="search-dash flex-grow-1 d-flex align-items-center input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
            <input type="text" id="buscarAlarma" class="form-control border-0 bg-transparent" placeholder="Buscar por nombre o barrio...">
          </div>
          <button class="icon-btn-dash btn btn-light rounded-circle position-relative">
            <i class="bi bi-bell"></i>
            <span class="dot-danger-dash position-absolute top-0 end-0"></span>
          </button>
          <span class="avatar-dash">SG</span>
        </div>

        <!-- Encabezado de la vista -->
        <div class="d-flex align-items-end justify-content-between flex-wrap gap-2 mb-4">
          <div>
            <p class="page-title-dash fw-bold m-0">Alarmas</p>
            <p class="info-sub-dash m-0">Gestión y monitoreo de las alarmas comunitarias registradas por barrio.</p>
          </div>
          <button class="btn btn-cv-azul rounded-pill d-inline-flex align-items-center gap-2" id="btnNuevaAlarma">
            <i class="bi bi-plus-lg"></i> Nueva alarma
          </button>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiTotalAlarmas">0</p>
                <p class="kpi-solid-label-dash">Total de alarmas</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-bell"></i></span>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiActivas">0</p>
                <p class="kpi-solid-label-dash">Activas</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-check-circle"></i></span>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiInactivas">0</p>
                <p class="kpi-solid-label-dash">Inactivas</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-slash-circle"></i></span>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="kpi-solid-dash">
              <div>
                <p class="kpi-solid-num-dash" id="kpiMantenimiento">0</p>
                <p class="kpi-solid-label-dash">En mantenimiento</p>
              </div>
              <span class="kpi-solid-icon-dash"><i class="bi bi-tools"></i></span>
            </div>
          </div>
        </div>

        <!-- Filtros -->
        <div class="d-flex gap-2 flex-wrap mb-3" id="filtrosAlarmas">
          <button class="chip-filtro-dash active" data-filtro="todas">Todas <span class="chip-count-dash" id="chipTodas">0</span></button>
          <button class="chip-filtro-dash" data-filtro="ACTIVA">Activas <span class="chip-count-dash" id="chipActivas">0</span></button>
          <button class="chip-filtro-dash" data-filtro="INACTIVA">Inactivas <span class="chip-count-dash" id="chipInactivas">0</span></button>
          <button class="chip-filtro-dash" data-filtro="EN_MANTENIMIENTO">En mantenimiento <span class="chip-count-dash" id="chipMantenimiento">0</span></button>
        </div>

        <!-- Tabla de alarmas -->
        <div class="card-panel-dash p-3">
          <div class="table-responsive">
            <table class="table table-borderless align-middle tabla-alarmas-dash mb-0">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Barrio</th>
                  <th>Estado</th>
                  <th>Radio (m)</th>
                  <th>Coordenadas</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="filaAlarmas">
                <!-- Se pinta dinámicamente desde localStorage -->
              </tbody>
            </table>
          </div>
          <p class="text-center text-muted py-4 m-0 d-none" id="mensajeVacio">No se encontraron alarmas.</p>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal: crear / editar alarma -->
  <div class="modal fade" id="modalFormAlarma" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formAlarma">
          <div class="modal-header">
            <h5 class="modal-title" id="modalFormTitulo">Nueva alarma</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="alarmaId">

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="alarmaNombre" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Barrio</label>
              <input type="text" class="form-control" id="alarmaBarrio" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Latitud</label>
                <input type="number" step="0.0001" class="form-control" id="alarmaLat" required>
              </div>
              <div class="col-6">
                <label class="form-label">Longitud</label>
                <input type="number" step="0.0001" class="form-control" id="alarmaLng" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Radio de cobertura (m)</label>
                <input type="number" min="1" class="form-control" id="alarmaRadio" required>
              </div>
              <div class="col-6">
                <label class="form-label">Estado</label>
                <select class="form-select" id="alarmaEstado" required>
                  <option value="ACTIVA">Activa</option>
                  <option value="INACTIVA">Inactiva</option>
                  <option value="EN_MANTENIMIENTO">En mantenimiento</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-cv-azul">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: ver detalle de alarma -->
  <div class="modal fade" id="modalVerAlarma" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalle de la alarma</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="verAlarmaContenido">
          <!-- Se llena dinámicamente -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sidebar-policia.js"></script>
  <script>
    renderSidebarPolicia('alarmas');
  </script>
  <script src="../js/alarmas.js"></script>
</body>
</html>
