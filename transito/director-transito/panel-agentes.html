<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Agentes de Tránsito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-agentes.css" />
  <script src="../../js/global.js" defer></script>
  <script src="../../js/transito/director-transito/panel-agentes.js" defer></script>
</head>

<body class="rol-transito rail-collapsed" data-rol="transito">
 
  <div class="d-flex" id="wrapperDash">
 
    <aside class="sidebar-dash" id="sidebarDash">
 
    </aside>
 
    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">
 
        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" placeholder="Buscar por agente, zona o placa...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>
 
        <!-- encabezado de sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="section-title-dash">Agentes de Tránsito</h1>
            <p class="section-text-dash mb-0">Gestiona el personal de campo asignado al módulo de Tránsito.</p>
          </div>
          <button type="button" class="btn btn-primary rounded-pill fw-bold btn-nuevo-dash" data-bs-toggle="modal" data-bs-target="#modalAgente">
            <i class="bi bi-person-plus me-2"></i>Nuevo agente
          </button>
        </div>
 
        <!-- KPIs -->
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="kpi-card-dash border-blue-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiTotal">0</div>
                <div class="kpi-label-dash">Agentes totales</div>
              </div>
              <i class="bi bi-people kpi-icon-dash"></i>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-green-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiActivos">0</div>
                <div class="kpi-label-dash">Activos ahora</div>
              </div>
              <i class="bi bi-person-check kpi-icon-dash"></i>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-red-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiInactivos">0</div>
                <div class="kpi-label-dash">Inactivos</div>
              </div>
              <i class="bi bi-person-dash kpi-icon-dash"></i>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-amber-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash">2.1 min</div>
                <div class="kpi-label-dash">Tiempo prom. de atención</div>
              </div>
              <i class="bi bi-stopwatch kpi-icon-dash"></i>
            </div>
          </div>
        </div>
 
        <!-- tabla -->
        <div class="table-card-dash">
 
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <div class="d-flex gap-2 tabs-dash">
              <button class="tab-dash active-dash" id="tabTodos" onclick="FiltrarAgentes('todos')">Todos (0)</button>
              <button class="tab-dash" id="tabActivos" onclick="FiltrarAgentes('activo')">Activos (0)</button>
              <button class="tab-dash" id="tabInactivos" onclick="FiltrarAgentes('inactivo')">Inactivos (0)</button>
            </div>
            <div class="input-group search-panel-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" id="buscarAgente" placeholder="Buscar agente, cédula o zona..." oninput="BuscarAgentes(this.value)">
            </div>
          </div>
 
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Agente</th>
                <th>Zona asignada</th>
                <th>Estado</th>
                <th>Casos atendidos (mes)</th>
                <th>Tiempo prom. atención</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaAgentesBody">
              <!-- Se llena dinámicamente desde panel-agentes.js -->
            </tbody>
          </table>
 
          <div class="d-flex justify-content-between align-items-center pt-3 paginacion-dash">
            <span class="text-muted small" id="resumenPaginacion">Mostrando 0 agentes</span>
            <div class="d-flex gap-1">
              <button class="page-btn-dash active-dash">1</button>
            </div>
          </div>
 
        </div>
 
      </div>
    </main>
 
  </div>
 
  <!-- ===================== MODAL: NUEVO AGENTE ===================== -->
  <div class="modal fade" id="modalAgente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content modal-dash">
        <div class="modal-header border-0 pb-0">
          <h5 class="panel-title-dash mb-0">Nuevo agente de tránsito</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="formAgente">
          <div class="modal-body">
            <div class="mb-3">
              <label class="config-field-label-dash">Nombre completo</label>
              <input type="text" class="form-control" id="inputNombre" placeholder="Ej: Camilo Vega" required>
            </div>
            <div class="mb-3">
              <label class="config-field-label-dash">Cédula</label>
              <input type="text" class="form-control" id="inputCedula" placeholder="Ej: CC 1085.223.910" required>
            </div>
            <div class="mb-3">
              <label class="config-field-label-dash">Zona asignada</label>
              <select class="form-select" id="inputZona" required>
                <option value="" disabled selected>Selecciona una zona</option>
                <option>Zona Norte</option>
                <option>Centro</option>
                <option>Sector La Nevada</option>
                <option>Los Fundadores</option>
              </select>
            </div>
            <div class="mb-1">
              <label class="config-field-label-dash">Estado inicial</label>
              <select class="form-select" id="inputEstado">
                <option value="activo" selected>Activo</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn-secundario-dash" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn-guardar-dash">Guardar agente</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/transito/director-transito/slidebar.js"></script>
  <script>renderSidebarTransito('agentes');</script>

</body>

</html>
