<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Semáforos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-semaforos.css" />
  <script src="../../js/global.js" defer></script>
   <script src="../../js/transito/director-transito/panel-semaforo.js" defer></script>
</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">

    <aside class="sidebar-dash" id="sidebarDash">

    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0 js-busqueda-sem" placeholder="Buscar por código, ubicación o barrio...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- encabezado -->
        <div class="row align-items-center mb-4">
          <div class="col">
            <h1 class="section-title-dash">Semáforos</h1>
            <p class="section-text-dash mb-0">Consulta, registra y da seguimiento al estado de los semáforos de la ciudad.</p>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-primario-dash" id="btnNuevoSemaforo">
              <i class="bi bi-plus-lg me-1"></i> Nuevo semáforo
            </button>
          </div>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="kpi-card-dash border-blue-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiSemaforosTotal">0</div>
                <div class="kpi-label-dash">Total de semáforos</div>
              </div>
              <span class="kpi-icon-box-dash bg-blue-dash"><i class="bi bi-signpost-2"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-green-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiSemaforosFuncionando">0</div>
                <div class="kpi-label-dash">Funcionando</div>
              </div>
              <span class="kpi-icon-box-dash bg-green-dash"><i class="bi bi-check2-circle"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-red-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiSemaforosDanados">0</div>
                <div class="kpi-label-dash">Dañados</div>
              </div>
              <span class="kpi-icon-box-dash bg-red-dash"><i class="bi bi-exclamation-triangle"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-amber-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiSemaforosMantenimiento">0</div>
                <div class="kpi-label-dash">En mantenimiento</div>
              </div>
              <span class="kpi-icon-box-dash bg-amber-dash"><i class="bi bi-tools"></i></span>
            </div>
          </div>
        </div>

        <!-- panel de búsqueda y filtros + tabla -->
        <div class="table-card-dash">

          <div class="filtros-fila-dash mb-3">
            <div class="input-group search-dash filtros-busqueda-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0 js-busqueda-sem" placeholder="Buscar por código, ubicación o barrio...">
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="pill-filtro-dash pill-funcionando-dash js-filtro-estado-sem" data-estado="funcionando">Funcionando</button>
              <button type="button" class="pill-filtro-dash pill-danado-dash js-filtro-estado-sem" data-estado="danado">Dañado</button>
              <button type="button" class="pill-filtro-dash pill-mantenimiento-dash js-filtro-estado-sem" data-estado="mantenimiento">En mantenimiento</button>
            </div>

            <button type="button" class="btn btn-light btn-sm" id="btnLimpiarFiltrosSemaforos">
              <i class="bi bi-x-circle me-1"></i> Limpiar
            </button>
          </div>

          <div class="d-flex gap-2 tabs-dash mb-3">
            <button class="tab-dash-sem active-dash" data-tipo="todas">Todas (0)</button>
            <button class="tab-dash-sem" data-tipo="vehicular">Vehicular (0)</button>
            <button class="tab-dash-sem" data-tipo="peatonal">Peatonal (0)</button>
          </div>

          <table class="table align-middle mb-0" id="tablaSemaforos">
            <thead>
              <tr>
                <th>Código</th>
                <th>Ubicación</th>
                <th>Barrio</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Última revisión</th>
                <th class="text-end">&nbsp;</th>
              </tr>
            </thead>
            <tbody>
              <!-- Las filas se generan dinámicamente desde panel-semaforos.js -->
            </tbody>
          </table>

          <div class="d-flex justify-content-between align-items-center pt-3 paginacion-dash">
            <span class="text-muted small" id="contadorResultadosSemaforos">Mostrando 0 de 0 semáforos</span>
            <div class="d-flex gap-1">
              <button class="page-btn-dash active-dash">1</button>
              <button class="page-btn-dash">2</button>
              <button class="page-btn-dash">3</button>
              <button class="page-btn-dash"><i class="bi bi-chevron-right"></i></button>
            </div>
          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- ===================== MODAL: Crear / Editar semáforo ===================== -->
  <div class="modal fade modal-dash" id="modalSemaforo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formSemaforo">
          <div class="modal-header">
            <h5 class="modal-title" id="formSemaforoTitulo">Nuevo semáforo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">

            <div class="mb-3">
              <label for="inputCodigo" class="form-label-dash">Código</label>
              <input type="text" class="form-control form-control-dash" id="inputCodigo" readonly>
            </div>

            <div class="mb-3">
              <label for="inputUbicacion" class="form-label-dash">Ubicación</label>
              <input type="text" class="form-control form-control-dash" id="inputUbicacion" placeholder="Ej: Cra 19 con Calle 16" required>
            </div>

            <div class="mb-3">
              <label for="inputBarrio" class="form-label-dash">Barrio</label>
              <input type="text" class="form-control form-control-dash" id="inputBarrio" placeholder="Ej: La Popa" required>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="inputTipo" class="form-label-dash">Tipo</label>
                <select class="form-select form-control-dash" id="inputTipo">
                  <option value="vehicular">Vehicular</option>
                  <option value="peatonal">Peatonal</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="inputEstado" class="form-label-dash">Estado</label>
                <select class="form-select form-control-dash" id="inputEstado">
                  <option value="funcionando">Funcionando</option>
                  <option value="danado">Dañado</option>
                  <option value="mantenimiento">En mantenimiento</option>
                </select>
              </div>
            </div>

            <div class="mb-1 mt-3">
              <label for="inputRevision" class="form-label-dash">Última revisión</label>
              <input type="date" class="form-control form-control-dash" id="inputRevision" required>
            </div>

          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primario-dash">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/transito/director-transito/slidebar.js"></script>
  <script>renderSidebarTransito('semaforos');</script>
 
</body>

</html>
