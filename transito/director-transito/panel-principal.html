<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Panel Director de Tránsito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-director.css" />
  <script src="../../js/global.js" defer></script>
  <script src="../../js/transito/panel-director.js" defer></script>

</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">
 
    <aside class="sidebar-dash" id="sidebarDash">
     
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-4">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" placeholder="Buscar por caso, barrio o agente...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- hero (en global.css se llama: .hero-dash) -->
        <div class="hero-dash mb-4">
          <button class="btn-close btn-close-white position-absolute top-0 end-0 m-3" id="heroClose"></button>
          <div class="eyebrow-dash">11 de septiembre de 2026 · 08:14 a. m.</div>
          <h1 class="hero-title-dash">Buenos días, Director de Tránsito</h1>
          <p class="hero-text-dash">Hay 6 casos de tránsito activos y 20 reportes registrados en las últimas 24
            horas. El sistema sigue monitoreando las vías de la ciudad en tiempo real.</p>
          <a href="#" class="btn btn-light rounded-pill fw-bold mt-3 hero-cta-dash">
            <span class="dot-danger-dash"></span> Ver casos críticos
          </a>
          <svg class="hero-icon-dash" width="110" height="110" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 8.7-8 11-4.6-2.3-8-6-8-11V5l8-3z" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg>
        </div>


      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujCsTpJa/mR1LT" crossorigin="anonymous"></script>
    <script src="/js/transito/director-transito/sidebar.js"></script>
  <script>renderSidebarTransito('panel');</script>
  </body>

</html>
