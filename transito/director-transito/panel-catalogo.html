<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Catálogos de Tránsito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-catalogo.css" />
  
  <script src="../../js/global.js" defer></script>
  <script src="../../js/transito/director-transito/panel-catalogo.js" defer></script>

</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">

    <aside class="sidebar-dash" id="sidebarDash">

    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" id="inputBuscarCatalogo"
                placeholder="Buscar por caso, barrio o agente...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="section-title-dash">Catálogos de Tránsito</h1>
            <p class="section-text-dash mb-0">Administra las zonas y los tipos de caso del módulo de Tránsito.</p>
          </div>
          <button class="btn btn-primary rounded-pill fw-bold btn-nuevo-dash" id="btnNuevoCatalogo">
            <i class="bi bi-plus-lg me-2"></i>Nuevo
          </button>
        </div>

        <!-- tabla -->
        <div class="table-card-dash">

          <div class="d-flex gap-2 tabs-dash mb-4">
            <button class="tab-dash active-dash" data-tab="zonas">
              Zonas y sectores (<span id="countZonas">0</span>)
            </button>
            <button class="tab-dash" data-tab="tipos">
              Tipos de caso (<span id="countTipos">0</span>)
            </button>
          </div>

          <!-- ZONAS Y SECTORES -->
          <div class="tab-panel-dash" id="panelZonas">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Zona / sector</th>
                  <th>Casos este mes</th>
                  <th>Agentes asignados</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbodyZonas">
                <!-- filas generadas por JS -->
              </tbody>
            </table>
            <p class="text-center text-muted py-4 mb-0 d-none" id="emptyZonas">No hay zonas registradas todavía.</p>
          </div>

          <!-- TIPOS DE CASO -->
          <div class="tab-panel-dash d-none" id="panelTipos">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Tipo de caso</th>
                  <th>Casos este mes</th>
                  <th>Prioridad</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbodyTipos">
                <!-- filas generadas por JS -->
              </tbody>
            </table>
            <p class="text-center text-muted py-4 mb-0 d-none" id="emptyTipos">No hay tipos de caso registrados
              todavía.</p>
          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- ===================== MODAL CREAR / EDITAR ===================== -->
  <div class="modal fade" id="modalCatalogo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="modalCatalogoTitulo">Nueva zona / sector</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formCatalogo">
            <input type="hidden" id="catalogoId">

            <!-- campo nombre, sirve para ambas entidades -->
            <div class="mb-3">
              <label class="form-label" id="labelNombreCatalogo">Nombre de la zona / sector</label>
              <input type="text" class="form-control" id="inputNombreCatalogo" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Casos este mes</label>
              <input type="number" min="0" class="form-control" id="inputCasosCatalogo" value="0" required>
            </div>

            <!-- solo para zonas -->
            <div class="mb-3" id="campoAgentes">
              <label class="form-label">Agentes asignados</label>
              <input type="number" min="0" class="form-control" id="inputAgentesCatalogo" value="0">
            </div>

            <!-- solo para tipos de caso -->
            <div class="mb-3 d-none" id="campoPrioridad">
              <label class="form-label">Prioridad</label>
              <select class="form-select" id="inputPrioridadCatalogo">
                <option value="Alta">Alta</option>
                <option value="Media" selected>Media</option>
                <option value="Baja">Baja</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold" id="btnGuardarCatalogo">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/transito/director-transito/slidebar.js"></script>
 
  <script>renderSidebarTransito('catalogo');</script>
</body>

</html>
