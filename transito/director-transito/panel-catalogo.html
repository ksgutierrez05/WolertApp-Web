<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Catálogos de Tránsito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-catalogo.css" />
  <script src="../../js/global.js" defer></script>
</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">

    <aside class="sidebar-dash" id="sidebarDash">

    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" placeholder="Buscar por caso, barrio o agente...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="section-title-dash">Catálogos de Tránsito</h1>
            <p class="section-text-dash mb-0">Administra las zonas y los tipos de caso del módulo de Tránsito.</p>
          </div>
          <button class="btn btn-primary rounded-pill fw-bold btn-nuevo-dash">
            <i class="bi bi-plus-lg me-2"></i>Nuevo
          </button>
        </div>

        <!-- tabla -->
        <div class="table-card-dash">

          <div class="d-flex gap-2 tabs-dash mb-4">
            <button class="tab-dash active-dash">Zonas y sectores (5)</button>
            <button class="tab-dash">Tipos de caso (2)</button>
          </div>

          <!-- ZONAS Y SECTORES -->
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Zona / sector</th>
                <th>Casos este mes</th>
                <th>Agentes asignados</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="fw-semibold">Zona Norte</td>
                <td>9</td>
                <td>2</td>
                <td class="text-end">
                  <button class="btn-icon-dash" title="Editar"><i class="bi bi-pencil"></i></button>
                  <button class="btn-icon-dash" title="Eliminar"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <tr>
                <td class="fw-semibold">Centro</td>
                <td>7</td>
                <td>1</td>
                <td class="text-end">
                  <button class="btn-icon-dash" title="Editar"><i class="bi bi-pencil"></i></button>
                  <button class="btn-icon-dash" title="Eliminar"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <tr>
                <td class="fw-semibold">Sector La Nevada</td>
                <td>3</td>
                <td>1</td>
                <td class="text-end">
                  <button class="btn-icon-dash" title="Editar"><i class="bi bi-pencil"></i></button>
                  <button class="btn-icon-dash" title="Eliminar"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <tr>
                <td class="fw-semibold">Los Fundadores</td>
                <td>1</td>
                <td>1</td>
                <td class="text-end">
                  <button class="btn-icon-dash" title="Editar"><i class="bi bi-pencil"></i></button>
                  <button class="btn-icon-dash" title="Eliminar"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <tr>
                <td class="fw-semibold">Casimiro Raúl Maestre</td>
                <td>0</td>
                <td>0</td>
                <td class="text-end">
                  <button class="btn-icon-dash" title="Editar"><i class="bi bi-pencil"></i></button>
                  <button class="btn-icon-dash" title="Eliminar"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
            </tbody>
          </table>

        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujCsTpJa/mR1LT" crossorigin="anonymous"></script>
  <script src="/js/transito/director-transito/slidebar.js"></script>
  <script>renderSidebarTransito('catalogo');</script>
</body>

</html>
