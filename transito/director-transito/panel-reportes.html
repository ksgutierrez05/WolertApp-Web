<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Reportes de Tránsito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-reportes.css" />
  <script src="../../js/global.js" defer></script>
</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">

    <aside class="sidebar-dash" id="sidebarDash"></aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" id="inputBuscarReportes"
                placeholder="Buscar por caso, barrio o agente...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="section-title-dash">Reportes</h1>
            <p class="section-text-dash mb-0">Consulta y exporta la actividad registrada por el módulo de Tránsito.</p>
          </div>
          <button class="btn btn-primary rounded-pill fw-bold btn-nuevo-dash" id="btnExportarReportes">
            <i class="bi bi-download me-2"></i>Exportar
          </button>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="kpi-card-dash border-red-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiUltimas24h">0</div>
                <div class="kpi-label-dash">Reportes últimas 24h</div>
              </div>
              <span class="kpi-icon-box-dash bg-red-dash"><i class="bi bi-copy"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-blue-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiTiempoPromedio">0h</div>
                <div class="kpi-label-dash">Tiempo promedio de atención</div>
              </div>
              <span class="kpi-icon-box-dash bg-blue-dash"><i class="bi bi-clock"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-green-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiResueltosMes">0</div>
                <div class="kpi-label-dash">Casos resueltos este mes</div>
              </div>
              <span class="kpi-icon-box-dash bg-green-dash"><i class="bi bi-check2"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-amber-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiCriticosActivos">0</div>
                <div class="kpi-label-dash">Casos críticos activos</div>
              </div>
              <span class="kpi-icon-box-dash bg-amber-dash"><i class="bi bi-suitcase-lg"></i></span>
            </div>
          </div>
        </div>

        <!-- filtros + tabla -->
        <div class="table-card-dash">

          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
            <div class="d-flex gap-2 tabs-dash" id="tabsReportes">
              <button class="tab-dash active-dash" data-tab="todos">Todos</button>
              <button class="tab-dash" data-tab="caso">Casos</button>
              <button class="tab-dash" data-tab="agente">Agentes</button>
              <button class="tab-dash" data-tab="zona">Zonas</button>
            </div>

            <div class="d-flex gap-2">
              <select class="form-select input-dash select-filtro-dash" id="selectRangoFecha">
                <option value="7" selected>Últimos 7 días</option>
                <option value="30">Últimos 30 días</option>
                <option value="mes">Este mes</option>
                <option value="todo">Personalizado</option>
              </select>
              <select class="form-select input-dash select-filtro-dash" id="selectZona">
                <option value="todas" selected>Todas las zonas</option>
                <option value="Zona Norte">Zona Norte</option>
                <option value="Centro">Centro</option>
                <option value="Sector La Nevada">Sector La Nevada</option>
                <option value="Los Fundadores">Los Fundadores</option>
              </select>
            </div>
          </div>

          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo de reporte</th>
                <th>Zona</th>
                <th>Agente</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tbodyReportes">
              <!-- filas generadas por JS -->
            </tbody>
          </table>
          <p class="text-center text-muted py-4 mb-0 d-none" id="emptyReportes">No hay reportes que coincidan con los filtros.</p>

        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujCsTpJa/mR1LT" crossorigin="anonymous"></script>
  <script src="/js/transito/director-transito/slidebar.js"></script>
  <script src="../../js/transito/director-transito/panel-reportes.js" defer></script>
  <script>renderSidebarTransito('reportes');</script>
</body>

</html>
