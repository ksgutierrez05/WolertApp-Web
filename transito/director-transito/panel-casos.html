<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Casos de Tránsito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-casos.css" />
  <script src="../../js/global.js" defer></script>
</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">

    <aside class="sidebar-dash" id="sidebarDash">

    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0 js-busqueda" placeholder="Buscar por caso, barrio o agente...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- encabezado -->
        <div class="mb-4">
          <h1 class="section-title-dash">Casos de Tránsito</h1>
          <p class="section-text-dash mb-0">Consulta y supervisa los casos reportados en el módulo de tránsito.</p>
        </div>

        <!-- KPIs -->
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="kpi-card-dash border-red-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash" id="kpiCasosActivos">6</div>
                <div class="kpi-label-dash">Casos activos</div>
              </div>
              <span class="kpi-icon-box-dash bg-red-dash"><i class="bi bi-geo-alt"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-blue-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash">2.1 min</div>
                <div class="kpi-label-dash">Tiempo de respuesta</div>
              </div>
              <span class="kpi-icon-box-dash bg-blue-dash"><i class="bi bi-clock"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-green-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash">27</div>
                <div class="kpi-label-dash">Casos cerrados hoy</div>
              </div>
              <span class="kpi-icon-box-dash bg-green-dash"><i class="bi bi-check2"></i></span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card-dash border-amber-dash">
              <div class="kpi-content-dash">
                <div class="kpi-value-dash">11/15</div>
                <div class="kpi-label-dash">Agentes disponibles</div>
              </div>
              <span class="kpi-icon-box-dash bg-amber-dash"><i class="bi bi-truck"></i></span>
            </div>
          </div>
        </div>

        <!-- panel de búsqueda y filtros + tabla -->
        <div class="table-card-dash">

          <div class="filtros-fila-dash mb-3">
            <div class="input-group search-dash filtros-busqueda-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0 js-busqueda" placeholder="Buscar por reportante, barrio...">
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="pill-filtro-dash pill-atencion-dash js-filtro-estado" data-estado="atencion">En atención</button>
              <button type="button" class="pill-filtro-dash pill-critica-dash js-filtro-estado" data-estado="critica">Crítica</button>
              <button type="button" class="pill-filtro-dash pill-camino-dash js-filtro-estado" data-estado="camino">En camino</button>
              <button type="button" class="pill-filtro-dash pill-resuelta-dash js-filtro-estado" data-estado="resuelta">Resuelta</button>
            </div>

            <button type="button" class="btn btn-light btn-sm" id="btnLimpiarFiltros">
              <i class="bi bi-x-circle me-1"></i> Limpiar
            </button>
          </div>

          <div class="d-flex gap-2 tabs-dash mb-3">
            <button class="tab-dash active-dash" data-tipo="todas">Todas (20)</button>
            <button class="tab-dash" data-tipo="accidente">Accidente (13)</button>
            <button class="tab-dash" data-tipo="semaforo">Semáforo dañado (7)</button>
          </div>

          <table class="table align-middle mb-0" id="tablaCasos">
            <thead>
              <tr>
                <th>Reportado por</th>
                <th>Tipo</th>
                <th>Barrio</th>
                <th>Estado</th>
                <th class="text-end">&nbsp;</th>
              </tr>
            </thead>
            <tbody>
              <!-- Las filas se generan dinámicamente desde panel-casos.js -->
            </tbody>
          </table>

          <div class="d-flex justify-content-between align-items-center pt-3 paginacion-dash">
            <span class="text-muted small" id="contadorResultados">Mostrando 20 de 20 reportes</span>
            <div class="d-flex gap-1">
              <button class="page-btn-dash active-dash">1</button>
              <button class="page-btn-dash">2</button>
              <button class="page-btn-dash">3</button>
              <button class="page-btn-dash"><i class="bi bi-chevron-right"></i></button>
            </div>
          </div>

        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujCsTpJa/mR1LT" crossorigin="anonymous"></script>
  <script src="/js/transito/director-transito/slidebar.js"></script>
  <script>renderSidebarTransito('casos');</script>
  <script src="../../js/transito/director-transito/panel-casos.js"></script>
</body>

</html>
