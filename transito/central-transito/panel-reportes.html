<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Informes de casos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/central-transito/panel-reportes.css" />
  <script src="../../js/global.js" defer></script>
  <script src="../../js/transito/central-transito/panel-reportes.js" defer></script>

</head>

<body class="rol-transito rail-collapsed" data-rol="transito">
 
  <div class="d-flex" id="wrapperDash">
 
    <aside class="sidebar-dash" id="sidebarDash">
 
    </aside>
 
    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">
 
        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" placeholder="Buscar por caso, barrio o agente...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">9+</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>
 
        <!-- encabezado -->
        <div class="mb-4">
          <h1 class="section-title-dash">Informes de casos</h1>
          <p class="section-text-dash mb-0">Registra lo que el agente reportó por radio en cada caso ya atendido.</p>
        </div>
 
        <!-- tabla -->
        <div class="table-card-dash">
 
          <div class="d-flex gap-2 tabs-dash mb-3">
            <button class="tab-dash active-dash" data-pestania="pendiente" id="tabPendientes">Pendientes de informe (0)</button>
            <button class="tab-dash" data-pestania="completado" id="tabCompletados">Completados hoy (0)</button>
          </div>
 
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Caso</th>
                <th>Barrio</th>
                <th>Agente</th>
                <th>Hora de cierre</th>
                <th class="text-end">&nbsp;</th>
              </tr>
            </thead>
            <tbody id="tablaCasosBody">
              <!-- filas generadas por JS -->
            </tbody>
          </table>
 
        </div>
 
        <!-- formulario de informe (oculto hasta pulsar "Completar informe") -->
        <div class="panel-card-dash mt-4 d-none" id="panelInforme">
          <h2 class="panel-title-dash" id="panelInformeTitulo">Completar informe</h2>
 
          <div class="row g-3">
            <div class="col-md-6">
              <label class="config-field-label-dash">Agente que atendió</label>
              <input type="text" class="form-control" id="inputAgente" disabled>
            </div>
            <div class="col-md-6">
              <label class="config-field-label-dash">Estado final del caso</label>
              <select class="form-select" id="selectEstadoFinal">
                <option>Resuelta</option>
                <option>Remitida a otra entidad</option>
                <option>Falsa alarma</option>
              </select>
            </div>
            <div class="col-12">
              <label class="config-field-label-dash">Lo reportado por el agente (vía radio)</label>
              <textarea class="form-control" rows="4" id="textareaReporte"
                placeholder="Ej: Choque leve entre dos vehículos, sin heridos, tránsito restablecido a las 09:35 a.m."></textarea>
            </div>
            <div class="col-12 d-flex justify-content-end gap-2">
              <button class="btn-secundario-dash" id="btnCancelarInforme">Cancelar</button>
              <button class="btn-asignar-dash" id="btnGuardarInforme">Guardar informe</button>
            </div>
          </div>
        </div>
 
      </div>
    </main>
 
  </div>
 

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/transito/central-transito/slidebar.js"></script>
  <script>renderSidebarTransito('reportes');</script>
</body>

</html>
