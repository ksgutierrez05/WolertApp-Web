<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WolertApp - Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/temas.css" />
  <link rel="stylesheet" href="../../css/transito/director-transito/panel-casos.css" />
  <link rel="stylesheet" href="../../css/transito/agente-transito/panel-perfil.css" />
  <script src="../../js/global.js" defer></script>
</head>

<body class="rol-transito rail-collapsed" data-rol="transito">

  <div class="d-flex" id="wrapperDash">

    <aside class="sidebar-dash" id="sidebarDash"></aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main-dash flex-grow-1">
      <div class="container-fluid px-4 py-4">

        <!-- topbar -->
        <div class="row g-3 align-items-center mb-5">
          <div class="col">
            <div class="input-group search-dash">
              <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0" placeholder="Buscar...">
            </div>
          </div>
          <div class="col-auto">
            <button class="btn btn-light rounded-circle position-relative icon-btn-dash">
              <i class="bi bi-bell"></i>
              <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">2</span>
            </button>
          </div>
          <div class="col-auto">
            <span class="avatar-dash" id="railToggle" title="Mostrar/ocultar perfil">D</span>
          </div>
        </div>

        <!-- encabezado -->
        <div class="mb-4">
          <h1 class="section-title-dash">Perfil</h1>
          <p class="section-text-dash mb-0">Tu información y la de tu grupo.</p>
        </div>

        <div class="row g-4">
          <!-- ===================== DATOS DEL AGENTE ===================== -->
          <div class="col-lg-5">
            <div class="profile-card-dash">
              <div class="profile-avatar-dash">DT</div>
              <div class="profile-name-dash">Diego Torres</div>
              <div class="profile-role-dash">Agente de Tránsito</div>

              <div class="profile-info-dash">
                <div class="profile-info-item-dash">
                  <span>Grupo</span>
                  <strong>Grupo 3 · Zona Norte</strong>
                </div>
                <div class="profile-info-item-dash">
                  <span>Correo</span>
                  <strong>diego.torres@transito.gov.co</strong>
                </div>
                <div class="profile-info-item-dash">
                  <span>Usuario</span>
                  <strong>dtorres</strong>
                </div>
              </div>
            </div>
          </div>

          <!-- ===================== CAMBIAR CONTRASEÑA ===================== -->
          <div class="col-lg-7">
            <div class="table-card-dash">
              <h2 class="section-subtitle-dash">Cambiar contraseña</h2>

              <form class="form-perfil-dash">
                <div class="form-group-dash">
                  <label for="passActual">Contraseña actual</label>
                  <input type="password" id="passActual" class="form-control">
                </div>
                <div class="form-group-dash">
                  <label for="passNueva">Nueva contraseña</label>
                  <input type="password" id="passNueva" class="form-control">
                </div>
                <div class="form-group-dash">
                  <label for="passConfirmar">Confirmar nueva contraseña</label>
                  <input type="password" id="passConfirmar" class="form-control">
                </div>
                <button type="submit" class="btn-primary-dash">Guardar cambios</button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-skAcpIdS7UcVUC05LJ9Dxay8AXcDYfBJqt1CJ85S/CFujCsTpJa/mR1LT" crossorigin="anonymous"></script>
  <script src="/js/transito/agente-transito/slidebar.js"></script>
  <script>renderSidebarTransito('perfil');</script>
</body>

</html>
