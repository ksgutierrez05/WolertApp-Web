<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alertas — WolertApp</title>

<!-- Bootstrap + iconos + fuentes (ajusta las rutas a tu proyecto) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<!-- Tus hojas de estilo del sistema -->
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/temas.css">

<!-- Estilos propios de esta vista -->
<link rel="stylesheet" href="../css/ciudadano/panel-alertas.css">
</head>

<body class="rol-ciudadano">

<aside class="sidebar-dash" id="sidebarDash"></aside>

<div id="wrapperDash">
  <main class="main-dash">
    <div class="container-fluid">

      <!-- Topbar simple -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title-dash"><i class="bi bi-broadcast"></i> Alertas</h1>
        <div class="d-flex align-items-center gap-3">
          <button class="btn icon-btn-dash rounded-circle border-0 bg-white">
            <i class="bi bi-search"></i>
          </button>
          <div class="avatar-dash">JC</div>
        </div>
      </div>

      <!-- KPIs -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
          <div class="kpi-dash kpi-red-dash">
            <i class="bi bi-broadcast kpi-icon-dash"></i>
            <p class="kpi-num-dash mb-0" id="kpiAlertasTotal">0</p>
            <p class="kpi-label-dash">Alertas reportadas</p>
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="kpi-dash kpi-blue-dash">
            <i class="bi bi-geo kpi-icon-dash"></i>
            <p class="kpi-num-dash mb-0" id="kpiAlertasComuna">0</p>
            <p class="kpi-label-dash" id="kpiAlertasComunaLabel">Alertas en mi comuna</p>
          </div>
        </div>
        <div class="col-6 col-md-4">
          <div class="kpi-dash kpi-amber-dash">
            <i class="bi bi-geo-alt kpi-icon-dash"></i>
            <p class="kpi-num-dash mb-0" id="kpiAlertasBarrio">0</p>
            <p class="kpi-label-dash" id="kpiAlertasBarrioLabel">Alertas en mi barrio</p>
          </div>
        </div>
      </div>

      <div class="card-panel-dash p-0">

        <!-- Filtros -->
        <div class="alertas-toolbar-dash">
          <div class="alertas-tabs-dash">
            <button class="alertas-tab-dash active" data-filtro="todas">Todas</button>
            <button class="alertas-tab-dash" data-filtro="mi_barrio">Mi barrio</button>
            <button class="alertas-tab-dash" data-filtro="mi_comuna">Mi comuna</button>
          </div>
        </div>

        <!-- Lista de alertas -->
        <div id="listaAlertas"></div>

      </div>

    </div>
  </main>
</div>

<!-- Sidebar (módulo independiente, reutilizable en todas las páginas) -->
<script src="../js/ciudadano/sidebar.js"></script>
<!-- Lógica propia de esta vista -->
<script src="../js/ciudadano/panel-alertas.js"></script>

</body>
</html>
