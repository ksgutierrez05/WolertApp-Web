<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/login/styles.css">
    <script src="../js/login/script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
    <body>
        <div class="login-card">

            <div class="login-panel-izq">
                <img src="../img/logo.png" alt="WolertApp" class="login-logo">
                <h1>WolertApp</h1>
                <p>Sistema de alertas comunitarias</p>
                <p class="login-tagline">Seguridad en tu barrio y notificaciones en tiempo real</p>
                <button type="button" class="btn-registrarse">Registrarse</button>
            </div>

            <div class="login-panel-der">
                <h2>Iniciar sesión</h2>
                <form>
                    <input type="text" placeholder="Usuario" class="login-input">
                    <input type="password" placeholder="Contraseña" class="login-input">
                    <button type="submit" class="btn-login">Ingresar</button>
                </form>
            </div>

        </div>
    </body>
</html>
