<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/login/styles.css">
    <script src="../js/login/script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

    <body>
        
        <a href="../landing/index.html" class="btn-volver">
            <i class="bi bi-arrow-left"></i>
            Volver
        </a>
        
        <div class="auth-container" id="auth-container">

            <div class="form-box form-login">
                <form id="form-login">
                    <h2>Iniciar sesión</h2>

                   <input type="text" placeholder="Usuario" class="login-input" id="username">

                    <div class="input-wrapper">
                        <i class="bi bi-lock"></i>
                        <input type="password" placeholder="Contraseña" class="login-input" id="password">
                        <i class="bi bi-eye" id="toggle-password"></i>
                    </div>

                    <div id="login-error" class="form-error" style="display: none;"></div>

                    <button type="submit" class="btn-login">Ingresar</button>
                    <a href="#" class="link-olvide">¿Olvidaste tu contraseña?</a>

                </form>
            </div>

            <div class="panel-deslizante" id="panel-deslizante">
                <img src="../img/logo.png" alt="WolertApp" class="login-logo">
                <h1>WolertApp</h1>
                <p>Sistema de alertas comunitarias</p>
                <p class="login-tagline">Seguridad para tu barrio y notificaciones en tiempo real</p>
                <button type="button" class="btn-registrarse" id="btn-toggle">Registrarse</button></div>

            <div class="form-box form-registro">
                <form id="form-registro">

                    <h2>Crear Cuenta</h2>
                    <p class="form-subtitle">Completa la información para registrarte</p>
                    <hr class="form-divider">

                    <div class="seccion-titulo">DATOS PERSONALES</div>

                    <div class="grid-2">
                        <input type="text" placeholder="Primer Nombre" class="input-gris" id="reg-primer-nombre" required>
                        <input type="text" placeholder="Segundo Nombre" class="input-gris" id="reg-segundo-nombre">
                    </div>

                    <div class="grid-2">
                        <input type="text" placeholder="Primer Apellido" class="input-gris" id="reg-primer-apellido" required>
                        <input type="text" placeholder="Segundo Apellido" class="input-gris" id="reg-segundo-apellido">
                    </div>

                    <div class="grid-2">
                        <input type="text" placeholder="Cédula" class="input-gris" id="reg-cedula" required>
                        <input type="tel" placeholder="Teléfono" class="input-gris" id="reg-telefono">
                    </div>

                    <input type="email" placeholder="Correo Electrónico" class="input-gris" id="reg-correo">

                    <div class="seccion-titulo">CUENTA</div>

                    <input type="text" placeholder="Username" class="input-gris" id="reg-username" required>

                    <div class="input-wrapper">
                        <i class="bi bi-lock"></i>
                        <input type="password" placeholder="Contraseña" class="input-gris" id="reg-password" required>
                    </div>

                    <div id="registro-error" class="form-error" style="display: none;"></div>

                    <button type="submit" class="btn-login">Registrarse</button>

                </form>
            </div>
        </div>
    </body>
</html>
