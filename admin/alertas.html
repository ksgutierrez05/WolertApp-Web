<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolertApp - Gestión de Alertas</title>
    <script src="../js/admin/script.js" defer></script>
    <script src="../js/admin/alertas.js" defer></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin/alertas.css">
    <link rel="stylesheet" href="../css/temas.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="rol-admin">

    <!-- El sidebar ya no vive aquí: script.js lo trae de sidebar.html -->
    <div id="sidebar-placeholder"></div>

    <div id="wrapperDash">
        <main class="main-dash">
            <div class="container-fluid">

                <!-- Encabezado -->
                <div class="mb-4">
                    <h1 class="hero-title-dash" style="color: var(--ink); font-size: 26px;">Gestión de Alertas</h1>
                    <p class="hero-text-dash" style="color: var(--muted);">Historial y seguimiento de alertas reportadas por la comunidad</p>
                </div>

                <!-- KPIs -->
                <div class="row g-3 mb-3">

                    <div class="col-md-4">
                        <div class="kpi-dash kpi-amber-dash">
                            <i class="bi bi-hourglass-split kpi-icon-dash"></i>
                            <div class="kpi-num-dash" id="kpi-pendientes">0</div>
                            <div class="kpi-label-dash">Pendientes</div>
                            <div class="kpi-label-dash" style="margin-top: 2px;">Sin unidad asignada</div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="kpi-dash kpi-blue-dash">
                            <i class="bi bi-shield-check kpi-icon-dash"></i>
                            <div class="kpi-num-dash" id="kpi-asignadas">0</div>
                            <div class="kpi-label-dash">Unidad asignada</div>
                            <div class="kpi-label-dash" style="margin-top: 2px;">En atención</div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="kpi-dash kpi-green-dash">
                            <i class="bi bi-check-circle kpi-icon-dash"></i>
                            <div class="kpi-num-dash" id="kpi-resueltas">0</div>
                            <div class="kpi-label-dash">Resueltas</div>
                            <div class="kpi-label-dash" style="margin-top: 2px;">Casos cerrados</div>
                        </div>
                    </div>

                </div>

                <!-- Buscador y filtros -->
                <div class="card-panel-dash p-3 mb-3">
                    <div class="row g-2 align-items-center">
                        <div class="col-lg-6">
                            <div class="search-dash d-flex align-items-center bg-white">
                                <span class="input-group-text bg-white border-0">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" id="buscador-alertas" class="form-control border-0" placeholder="Buscar por barrio, usuario o descripción...">
                            </div>
                        </div>
                        <div class="col-lg-3 col-6">
                            <select id="filtro-estado-alerta" class="filtro-select-dash form-select">
                                <option value="">Estado: Todos</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="unidad_asignada">Unidad asignada</option>
                                <option value="resuelta">Resuelta</option>
                            </select>
                        </div>
                        <div class="col-lg-3 col-6">
                            <select id="filtro-tipo-alerta" class="filtro-select-dash form-select">
                                <option value="">Tipo: Todos</option>
                                <option value="HOMICIDIO">Homicidio</option>
                                <option value="ROBO">Robo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Tabla de alertas -->
                <div class="card-panel-dash">
                    <div class="table-responsive">
                        <table class="tabla-alertas-dash">
                            <thead>
                                <tr>
                                    <th>Tipo</th>
                                    <th>Barrio</th>
                                    <th>Usuario</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Descripción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-alertas-body">
                                <!-- Las filas se pintan dinámicamente desde js/admin/alertas.js -->
                            </tbody>
                        </table>
                    </div>
                    <div id="alertas-vacio" class="alertas-vacio-dash" style="display: none;">
                        <i class="bi bi-inboxes"></i>
                        <p>No se encontraron alertas con esos filtros.</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
