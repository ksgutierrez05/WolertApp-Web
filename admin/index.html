<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolertApp - Panel de administrador</title>
    <script src="../js/admin/script.js" defer></script>
    <link rel="stylesheet" href="../css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="rol-admin">
    
    <div class="sidebar-dash">

        <div class="brand-dash">
            <div style="display: flex; align-items: center;">
                <div class="brand-icon-dash">
                    <img src="../img/logo.png" alt="WolertApp" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">
                </div>
                <div style="margin-left: 12px;">
                    <span class="brand-name-dash" style="display: block; margin-left: 0;">WolertApp</span>
                    <span class="brand-subtitle-dash">Panel Administrativo</span>
                </div>
            </div>
        </div>

        <div class="menu-dash">

            <span class="glabel-dash">General</span>

            <a href="#" class="active">
                <i class="bi bi-speedometer2"></i>
                <span class="lbl-dash">Dashboard</span>
            </a>
            <a href="#">
                <i class="bi bi-people"></i>
                <span class="lbl-dash">Usuarios</span>
            </a>
            <a href="#">
                <i class="bi bi-bell"></i>
                <span class="lbl-dash">Alertas</span>
            </a>
            <a href="#">
                <i class="bi bi-megaphone"></i>
                <span class="lbl-dash">Alarmas</span>
            </a>

            <span class="glabel-dash">Ubicaciones</span>

            <a href="#">
                <i class="bi bi-geo-alt"></i>
                <span class="lbl-dash">Comunas</span>
            </a>
            <a href="#">
                <i class="bi bi-house"></i>
                <span class="lbl-dash">Barrios</span>
            </a>
            <a href="#">
                <i class="bi bi-list-ul"></i>
                <span class="lbl-dash">Tipos</span>
            </a>

            <span class="glabel-dash">Sistema</span>

            <a href="#">
                <i class="bi bi-bell-slash"></i>
                <span class="lbl-dash">Notificaciones</span>
            </a>
            <a href="#">
                <i class="bi bi-file-earmark-text"></i>
                <span class="lbl-dash">Reportes</span>
            </a>
            <a href="#">
                <i class="bi bi-graph-up"></i>
                <span class="lbl-dash">Estadísticas</span>
            </a>
            <a href="#">
                <i class="bi bi-gear"></i>
                <span class="lbl-dash">Configuración</span>
            </a>

        </div>

        <a href="#" class="logout-dash">
            <i class="bi bi-box-arrow-right"></i>
            <span class="lbl-dash">Cerrar sesión</span>
        </a>

    </div>

    <div id="wrapperDash">
        <main class="main-dash">
            <div class="container-fluid">

            </div>
        </main>
    </div>
</body>
</html>
