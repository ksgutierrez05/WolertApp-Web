<!--
    FRAGMENTO DE SIDEBAR
    --------------------
    Este archivo NO es una página completa (no tiene <html>/<head>/<body>).
    Se inyecta dentro de cada página del panel admin mediante fetch()
    desde js/admin/script.js (función cargarSidebar).

    Los href de cada link deben coincidir EXACTAMENTE con el nombre de
    archivo de la página a la que apuntan (ej: "usuarios.html"), porque
    script.js compara la URL actual contra estos href para marcar
    automáticamente el link activo. Por eso ningún link aquí lleva la
    clase "active" escrita a mano: la pone el JS según en qué página estés.
-->
