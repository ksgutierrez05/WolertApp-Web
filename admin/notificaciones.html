<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolertApp - Notificaciones</title>
    <script src="../js/admin/script.js" defer></script>
    <script src="../js/admin/notificaciones.js" defer></script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin/notificaciones.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="rol-admin">

    <div id="sidebar-placeholder"></div>

    <div id="wrapperDash">
        <main class="main-dash">
            <div class="container-fluid">

                <!-- Encabezado -->
                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                    <div>
                        <h1 class="hero-title-dash" style="color: var(--ink); font-size: 26px;">Notificaciones del sistema</h1>
                        <p class="hero-text-dash" style="color: var(--muted);">Historial de mensajes enviados a los usuarios</p>
                    </div>
                    <button type="button" class="btn btn-cv-azul d-inline-flex align-items-center gap-2 px-3 py-2" style="border-radius: 12px; font-size: 13.5px; font-weight: 700;">
                        <i class="bi bi-arrow-clockwise"></i>
                        Reintentar fallidas
                    </button>
                </div>

                <!-- KPIs -->
                <div class="row g-3 mb-3">

                    <div class="col-md-4">
                        <div class="kpi-dash kpi-blue-dash">
                            <i class="bi bi-bell kpi-icon-dash"></i>
                            <div class="kpi-num-dash" id="kpi-total">0</div>
                            <div class="kpi-label-dash">Total enviadas</div>
                            <div class="kpi-label-dash" style="margin-top: 2px;">Últimos registros</div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="kpi-dash kpi-amber-dash">
                            <i class="bi bi-hourglass-split kpi-icon-dash"></i>
                            <div class="kpi-num-dash" id="kpi-pendientes">0</div>
                            <div class="kpi-label-dash">Pendientes</div>
                            <div class="kpi-label-dash" style="margin-top: 2px;">Por confirmar entrega</div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="kpi-dash kpi-red-dash">
                            <i class="bi bi-exclamation-triangle kpi-icon-dash"></i>
                            <div class="kpi-num-dash" id="kpi-error">0</div>
                            <div class="kpi-label-dash">Con error</div>
                            <div class="kpi-label-dash" style="margin-top: 2px;">Necesitan reintento</div>
                        </div>
                    </div>

                </div>

                <!-- Buscador y filtros -->
                <div class="card-panel-dash p-3 mb-3">
                    <div class="row g-2 align-items-center">
                        <div class="col-lg-6">
                            <div class="search-dash d-flex align-items-center bg-white">
                                <span class="input-group-text bg-white border-0">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" id="buscador-notificaciones" class="form-control border-0" placeholder="Buscar por mensaje o destinatario...">
                            </div>
                        </div>
                        <div class="col-lg-3 col-6">
                            <select id="filtro-estado-noti" class="filtro-select-dash form-select">
                                <option value="">Estado: Todos</option>
                                <option value="enviado">Enviado</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="error">Error</option>
                            </select>
                        </div>
                        <div class="col-lg-3 col-6">
                            <select id="filtro-tipo-noti" class="filtro-select-dash form-select">
                                <option value="">Tipo: Todos</option>
                                <option value="alerta">Alerta</option>
                                <option value="asignacion">Asignación</option>
                                <option value="sistema">Sistema</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Tabla de notificaciones -->
                <div class="card-panel-dash">
                    <div class="table-responsive">
                        <table class="tabla-noti-dash">
                            <thead>
                                <tr>
                                    <th>Mensaje</th>
                                    <th>Destinatario</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-noti-body">
                                <!-- Las filas se pintan dinámicamente desde js/admin/notificaciones.js -->
                            </tbody>
                        </table>
                    </div>
                    <div id="noti-vacio" class="noti-vacio-dash" style="display: none;">
                        <i class="bi bi-bell-slash"></i>
                        <p>No se encontraron notificaciones con esos filtros.</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
